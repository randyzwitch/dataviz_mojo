name: Polar crash diagnostic (#732)

# Throwaway workflow for #732: tests/test_marks_polar.mojo crashes on
# macos-latest in roughly one CI run in five, printing a stack of raw
# addresses and no test output, so the log never says which test faults.
#
# Pushing this branch runs it; the Actions tab can also re-run it with
# different inputs. It does three things the normal test job cannot:
#
#  1. Runs *only* that module, many times, so a run is minutes rather
#     than the 25 the full macOS job takes.
#  2. Runs several copies at once. Every observed crash came from the
#     parallel suite, so contention is part of the recipe; a single
#     quiet run may never fail.
#  3. Runs tests/zz_polar_probe.mojo, which calls the module's 71 tests
#     one at a time and names each on **stderr** before running it.
#     The module's own runner holds its stdout until the end, so a
#     crash takes every PASS line with it -- killing a healthy run
#     partway through leaves an empty file even on a pty, which is why
#     the original logs showed no test output. stderr is unbuffered
#     and survives a SIGKILL, so the last `START` line is the test that
#     was running when the process went down.
#  4. Also runs an ahead-of-time build with line tables, which is what
#     the toolchain's own crash message asks for and the only way to
#     turn the addresses into function names. That build is a different
#     execution path from `mojo run`'s JIT, so it may not reproduce the
#     crash at all -- which is itself worth knowing, and why both are
#     here.
#
# Delete this file once #732 is understood.

on:
  # Nothing triggers this any more. The CI hunt is over (#732 is a JIT
  # fault, not ours to fix from here); the branch stays because the
  # probe modules below are what to run on a macOS machine when one is
  # available. Re-add a push trigger to use it from CI again.
  workflow_dispatch:
    inputs:
      iterations:
        description: "Rounds to run (each round runs `copies` processes at once)"
        default: "20"
      copies:
        description: "Concurrent copies per round"
        default: "4"
      mode:
        description: "jit, aot, probe, repro, ranges (the bisect), or all"
        default: "ranges"

permissions:
  contents: read

jobs:
  hammer:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install libfontconfig
        run: brew install fontconfig && brew install --cask font-dejavu && fc-cache -f

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Record the toolchain and machine
        run: |
          pixi run mojo --version
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
          sw_vers

      - name: Build with line tables
        if: inputs.mode == '' || inputs.mode == 'aot' || inputs.mode == 'all'
        run: |
          mkdir -p build
          pixi run mojo build -debug-level=line-tables -I . -I tests \
            tests/test_marks_polar.mojo -o build/test_marks_polar

      - name: Hammer it
        env:
          ITERATIONS: ${{ inputs.iterations }}
          COPIES: ${{ inputs.copies }}
          MODE: ${{ inputs.mode }}
        run: |
          # A push carries no inputs, so the defaults live here too.
          ITERATIONS="${ITERATIONS:-8}"
          COPIES="${COPIES:-1}"
          MODE="${MODE:-ranges}"
          mkdir -p crashes
          crashed=0
          ran=0
          for i in $(seq 1 "$ITERATIONS"); do
            for c in $(seq 1 "$COPIES"); do
              if [ "$MODE" = "jit" ] || [ "$MODE" = "all" ] \
                || [ "$MODE" = "ranges" ]; then
                ( pixi run mojo run -I . -I tests tests/test_marks_polar.mojo \
                    > "crashes/jit_${i}_${c}.out" 2>&1 \
                  || echo "$?" > "crashes/jit_${i}_${c}.code" ) &
              fi
              if [ "$MODE" = "probe" ] || [ "$MODE" = "all" ]; then
                ( pixi run mojo run -I . -I tests tests/zz_polar_probe.mojo \
                    > "crashes/probe_${i}_${c}.out" 2>&1 \
                  || echo "$?" > "crashes/probe_${i}_${c}.code" ) &
              fi
              if [ "$MODE" = "repro" ] || [ "$MODE" = "all" ]; then
                ( pixi run mojo run -I . zz_repro_732.mojo \
                    > "crashes/repro_${i}_${c}.out" 2>&1 \
                  || echo "$?" > "crashes/repro_${i}_${c}.code" ) &
              fi
              if [ "$MODE" = "ranges" ] || [ "$MODE" = "all" ]; then
                for r in 0 8 12 15; do
                  ( pixi run mojo run -I . -I tests "tests/zz_range_${r}.mojo" \
                      > "crashes/range${r}_${i}_${c}.out" 2>&1 \
                    || echo "$?" > "crashes/range${r}_${i}_${c}.code" ) &
                done
              fi
              if [ "$MODE" = "aot" ] || [ "$MODE" = "all" ]; then
                ( ./build/test_marks_polar \
                    > "crashes/aot_${i}_${c}.out" 2>&1 \
                  || echo "$?" > "crashes/aot_${i}_${c}.code" ) &
              fi
            done
            wait
            echo "round $i done"
          done
          # A run that exits nonzero, or that finished neither with a
          # test summary (the module) nor with ALL DONE (the probe), is
          # a failure. The crash prints no summary at all, which is the
          # signature in #732.
          for f in crashes/*.out; do
            ran=$((ran + 1))
            if [ -f "${f%.out}.code" ] \
              || ! grep -qE "tests run:|ALL DONE" "$f"; then
              crashed=$((crashed + 1))
              echo "=== FAILED: $f (exit $(cat "${f%.out}.code" 2>/dev/null || echo 0))"
              tail -40 "$f"
              # For a probe run this is the whole point: the last test
              # started, and whether it ever finished.
              echo "--- last START: $(grep '^START ' "$f" | tail -1)"
              echo "--- last DONE:  $(grep '^DONE ' "$f" | tail -1)"
              echo "--- last iter:  $(grep '^iter ' "$f" | tail -1)"
            else
              rm -f "$f"
            fi
          done
          echo "ran=$ran crashed=$crashed"
          echo "ran=$ran crashed=$crashed" >> "$GITHUB_STEP_SUMMARY"
          # The point is the evidence, not a red X: a clean sweep and a
          # reproduced crash are both results, so the job passes either
          # way and the artifact carries whatever was caught.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polar-crash-logs
          path: crashes/
          if-no-files-found: ignore
