name: Docs build (reusable)

# The actual build logic (mojo doc -> modo build -> hugo). A
# `workflow_call` reusable workflow, called by docs-deploy.yml (push
# to main, builds then deploys) -- kept as its own file rather than a
# job inlined there so a job gated `if: github.event_name == 'push'`
# doesn't show up as an always-"skipped" check on every PR forever
# (worse than no check at all). ci.yml's own `docs-build` job covers
# the PR-status-only case instead, by reusing the example images its
# own `test` job already rendered rather than calling this file a
# second time -- re-rendering every example a second time here too,
# on every PR, used to be exactly that: pure duplicate compute, and
# every extra Mojo compile is another roll against the compiler crash
# in `pixi run test`/`pixi run example`'s own known flakiness. This
# file's own render (below) still runs for real once per push to main,
# there's just no PR-side twin of it left to duplicate it.
# Always uploads the Pages artifact (cheap, not itself a publish step
# -- deploy-pages, in docs-deploy.yml only, is the one that actually
# goes live) so docs-deploy.yml can deploy it without rebuilding.

on:
  workflow_call:

# Just enough to checkout + upload a build artifact -- actions/upload-
# pages-artifact doesn't need Pages-specific permissions itself, it's
# a plain workflow artifact under the hood. pages:write/id-token:write
# belong specifically to the deploy-pages step, in docs-deploy.yml's
# own deploy job, not here.
permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Mojo compiles here are heavy -- pixi run example alone has taken
    # several minutes per file in this repo before; see ci.yml's own
    # identical comment.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same runtime requirement as ci.yml's own identical step --
      # see its comment for the full "why fontconfig, not freetype"
      # story. pixi run docs itself only needs mojo (for `mojo doc`)
      # and hugo/go (for the Hugo build), but pixi run example (below)
      # draws real text same as the test suite does.
      - name: Install libfontconfig and test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Render quickstart tutorial examples
        run: pixi run example-quickstart

      - name: Build docs site
        run: pixi run docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/public
