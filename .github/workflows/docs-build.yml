name: Docs build (reusable)


on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install libfontconfig and test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Render quickstart tutorial examples
        run: pixi run example-quickstart

      - name: Build docs site
        run: pixi run docs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/public
