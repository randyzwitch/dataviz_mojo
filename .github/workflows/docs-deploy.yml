name: Docs deploy


on:
  push:
    branches: [main]
    paths:
      - "dataviz/**"
      - "docs/src/**"
      - "docs/site/hugo.yaml"
      - "docs/site/go.mod"
      - "docs/site/go.sum"
      - "docs/modo.yaml"
      - "pixi.toml"
      - "scripts/install-modo.sh"
      - "scripts/gen_example_docs.mojo"
      - "scripts/_example_docstrings.mojo"
      - "scripts/extract_docstring_examples.mojo"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
