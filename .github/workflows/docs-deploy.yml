name: Docs deploy

# Builds (via docs-build.yml) and deploys the docs site on every push
# to main -- see docs-build.yml's own comment for why deploying is
# split into its own workflow file rather than a same-file job gated
# by `if: github.event_name == 'push'`. Never runs on a pull_request,
# so it only ever shows up as a check on main's own commits, not on a
# PR a feature branch's own Actions run has no business publishing
# from.
#
# Path filter is this file's own -- unlike the PR-side docs build
# (ci.yml's `docs-build` job, unconditional now that it no longer pays
# its own render cost, see that job's comment), an actual deploy still
# goes live to GitHub Pages, so it stays worth skipping when nothing
# docs-relevant changed.

on:
  push:
    branches: [main]
    paths:
      - "dataviz/**"
      - "docs/src/**"
      - "docs/site/hugo.yaml"
      - "docs/site/go.mod"
      - "docs/site/go.sum"
      - "docs/modo.yaml"
      - "pixi.toml"
      - "scripts/install-modo.sh"
      - "scripts/gen_example_docs.mojo"
      - "scripts/_example_docstrings.mojo"
      - "scripts/extract_docstring_examples.mojo"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
