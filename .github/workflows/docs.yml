name: Docs

# Builds the docs site on a pull request, purely so its status is
# visible as a check before merging -- deliberately not a required
# one, see the repo's own branch protection settings. Deliberately
# has no deploy job at all, not even a skipped one: a job gated by
# `if: github.event_name == 'push'` still creates its own check-run
# entry, just permanently stuck on "skipped" for every PR, forever --
# noise with no signal. docs-deploy.yml (push to main only) is where
# an actual deploy job exists, so it only ever shows up where it can
# mean something.
#
# Triggers whenever something that actually feeds the site changes --
# dataviz_mojo/'s own docstrings, examples/ (both the code and its
# rendered output, which `docs` copies rather than re-rendering), the
# hand-written pages in docs/src/, the Hugo project itself
# (docs/site/*.yaml, go.mod/go.sum), or the doc-generation config/
# tooling. Kept identical to docs-deploy.yml's own path filter (a YAML
# anchor/alias would need both files' triggers in one place to share,
# which `workflow_call` doesn't offer across files -- duplicated here
# deliberately, not accidentally).

on:
  pull_request:
    paths:
      - "dataviz_mojo/**"
      - "examples/**"
      - "docs/src/**"
      - "docs/site/hugo.yaml"
      - "docs/site/go.mod"
      - "docs/site/go.sum"
      - "docs/modo.yaml"
      - "pixi.toml"
      - "scripts/install-modo.sh"
      - "scripts/gen_example_docs.mojo"
      - ".github/workflows/docs-build.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/docs-build.yml
