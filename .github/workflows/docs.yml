name: Docs

# Builds the docs site (see pixi.toml's own `docs` task, modo.yaml)
# and deploys it straight to GitHub Pages via Actions -- no branch
# ever holds the generated output; deploy-pages publishes the build
# artifact directly to Pages' own hosting. Runs on both a pull request
# (so its status is visible as a check before merging -- deliberately
# not a required one, see the repo's own branch protection settings)
# and a push to main, but the actual `deploy-pages` step only runs on
# the latter: deploying from a PR run would mean a feature branch's
# own Actions run publishing the live site before review, exactly the
# thing PRs exist to prevent.
#
# Triggers whenever something that actually feeds the site changes --
# dataviz_mojo/'s own docstrings, examples/ (both the code and its
# rendered output, which `docs` copies rather than re-rendering), the
# hand-written pages in docs/src/, the Hugo project itself
# (docs/site/*.yaml, go.mod/go.sum), or the doc-generation config/
# tooling.

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "dataviz_mojo/**"
      - "examples/**"
      - "docs/src/**"
      - "docs/site/hugo.yaml"
      - "docs/site/go.mod"
      - "docs/site/go.sum"
      - "modo.yaml"
      - "pixi.toml"
      - "scripts/install-modo.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Mojo compiles here are heavy -- pixi run example alone has taken
    # several minutes per file in this repo before; see ci.yml's own
    # identical comment.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same runtime requirement as ci.yml's own identical step --
      # see its comment for the full "why fontconfig, not freetype"
      # story. pixi run docs itself only needs mojo (for `mojo doc`)
      # and hugo/go (for the Hugo build), but pixi run example (below)
      # draws real text same as the test suite does.
      - name: Install libfontconfig and test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Build docs site
        run: pixi run docs

      - if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/public

  deploy:
    if: github.event_name == 'push'
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
