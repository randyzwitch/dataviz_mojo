name: Docs

# Builds docs/ (see pixi.toml's own `docs` task, modo.yaml) on both a
# pull request (so its status is visible as a check before merging --
# deliberately not a required one, see the repo's own branch
# protection settings) and a push to main, but only actually commits
# the result on the latter: committing from a PR run would mean a fork
# or feature branch's own Actions run pushing straight to main, which
# is exactly the thing PRs exist to review first. On push to main,
# commits docs/ back with the default GITHUB_TOKEN if (and only if) it
# changed -- no separate build+deploy pipeline, since the committed
# docs/ is what GitHub Pages already serves (main:/docs).
#
# Triggers whenever something that actually feeds docs/ changes --
# dataviz_mojo/'s own docstrings, examples/ (both the code and its
# rendered output, which `docs` copies rather than re-rendering), the
# hand-written pages in docs/_src/, or the doc-generation config/
# tooling itself.

on:
  push:
    branches: [main]
    paths: &docs-paths
      - "dataviz_mojo/**"
      - "examples/**"
      - "docs/_src/**"
      - "modo.yaml"
      - "pixi.toml"
      - "scripts/install-modo.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Mojo compiles here are heavy -- pixi run example alone has taken
    # several minutes per file in this repo before; see ci.yml's own
    # identical comment.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same runtime requirement as ci.yml's own identical step --
      # see its comment for the full "why fontconfig, not freetype"
      # story. pixi run docs itself only needs mojo (for `mojo doc`),
      # but pixi run example (below) draws real text same as the test
      # suite does.
      - name: Install libfontconfig and test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Regenerate docs
        run: pixi run docs

      - name: Commit and push docs/ if it changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "docs/ unchanged, nothing to commit"
          else
            git commit -m "docs: regenerate (automated)"
            git push origin HEAD:main
          fi
