name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check [workspace]/[package] version agree
    runs-on: ubuntu-latest
    # Pure bash against pixi.toml's text -- no pixi/Mojo toolchain needed,
    # so this doesn't wait on setup-pixi or share a runner with the heavy
    # `test`/`docs-build` jobs below. See #228: nothing enforced this
    # before, and each of #164/#187/#201 edited both fields by hand.
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_version.sh

  format-check:
    name: mojo format --check
    runs-on: ubuntu-latest
    # Pure formatter pass over already-checked-out source -- no
    # canvas_mojo/libfontconfig runtime needed (nothing here renders),
    # so this reports a formatting slip in seconds rather than waiting
    # behind the heavy `test`/`docs-build` compiles below (#226).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Check formatting
        run: pixi run format-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Mojo compiles here are heavy (some individual test files take
    # several minutes) -- generous timeout rather than a flaky
    # default.
    timeout-minutes: 60
    steps:
      # v7 specifically, not just "latest v4" -- v4 is built against
      # Node.js 20, which GitHub Actions runners now force onto Node 24
      # instead. v7 is built against Node 24 natively, no forced-compat
      # warning -- see canvas_mojo's own CI for the fuller writeup.
      - uses: actions/checkout@v7

      # canvas_mojo (this package's own dependency) links directly
      # against system libfontconfig at runtime for text rendering --
      # not bundled, not satisfied by the conda-forge fontconfig
      # package canvas_mojo's own [package.run-dependencies] pulls in
      # (that provides headers/dev libs for the build, not what
      # canvas_mojo's own FFI actually dlopens at runtime). tests/*.mojo
      # draws real text too (render() draws axis/tick labels and titles
      # by default; test_labels.mojo/test_theme.mojo exercise
      # draw_text()/measure_text() directly), so this is a real runtime
      # requirement for `pixi run test` on its own, independent of
      # `pixi run example` -- that doesn't render in this job at all
      # (see the docs-build job below: dataviz/*.mojo's own
      # `Example:` docstring sections exist to feed the docs site's
      # gallery, not this package's own test signal, so rendering them
      # lives entirely in the docs pipeline, run once there rather than
      # a second time here). libfreetype used to be
      # installed here too, but canvas_mojo v0.1.0 (this package's
      # now-tagged dependency, see pixi.toml) replaced its own FreeType
      # FFI binding with a native TrueType parser (canvas/text/
      # ttf.mojo) -- fontconfig (font *discovery*, resolving a family
      # name to an actual installed file) is the only system library
      # left linked, the same fix canvas_mojo's own CI already made for
      # the identical reason.
      #
      # fonts-dejavu-core is a real runtime dependency too, not
      # cosmetic: no test here passes an explicit font family to
      # draw_text()/measure_text(), so every one resolves canvas's
      # own default ("Sans") through fontconfig -- DejaVu Sans on a bare
      # Ubuntu runner image, which ships libfontconfig without any
      # actual font files installed.
      - name: Install libfontconfig (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - name: Install libfontconfig (macOS)
        if: runner.os == 'macOS'
        run: brew install fontconfig && brew install --cask font-dejavu && fc-cache -f

      # Pinned to match the pixi version pixi.lock (v7 format) was
      # generated with locally -- see canvas_mojo's own CI for why.
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Run tests
        run: pixi run test

  # The only install path the README and quickstart actually document is
  # a pixi dependency that builds this package with pixi-build-mojo and
  # installs the resulting .mojopkg -- and until this job, nothing in CI
  # went anywhere near it (#227). `test` and `docs-build` both compile
  # from source with `-I .`, which never runs `mojo package` at all, so a
  # break in [package.build.config.pkg], a new file `mojo package`
  # rejects, or a canvas_mojo tag bump that breaks host-dependency
  # resolution would all reach main green and surface first for a
  # downstream user.
  #
  # A `path` dependency rather than `git`, deliberately: git would
  # resolve to whatever is already pushed, so a PR would test main's tree
  # instead of its own. `path` points the throwaway workspace at the
  # checked-out PR, which is the thing under test.
  #
  # The consumer writes both an .svg and a .png because they exercise
  # different halves of the installed package -- the SVG backend is pure
  # Mojo string building, while the PNG path goes through the raster
  # canvas and canvas_mojo's font discovery, which is where a broken
  # runtime dependency actually shows up. Both are asserted non-empty
  # rather than merely created, since save() opens the file before it
  # renders.
  #
  # libfontconfig/fonts-dejavu-core for the same reason the `test` job
  # needs them (see its own comment): save() renders axis and tick
  # labels, so this resolves a real font through fontconfig.
  package:
    name: Build the package and compile a consumer against it
    runs-on: ubuntu-latest
    # `pixi build` compiles the whole package plus canvas_mojo from
    # source, then the consumer workspace builds it a second time in its
    # own environment -- two full Mojo compiles, so this is closer to
    # `test` than to the cheap text-only jobs above.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install libfontconfig
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Build the package
        run: pixi build

      # Under $RUNNER_TEMP rather than inside the checkout, so the
      # consumer workspace's own .pixi/ and lockfile can't be mistaken
      # for repo state by a later step.
      - name: Create a throwaway consumer workspace
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/pixi.toml" <<EOF
          [workspace]
          name = "dataviz-consumer-check"
          version = "0.0.0"
          channels = ["https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]

          [dependencies]
          dataviz_mojo = { path = "$GITHUB_WORKSPACE" }
          EOF
          cat > "$RUNNER_TEMP/consumer/consumer.mojo" <<'EOF'
          from dataviz import bar
          from dataviz.plot import save

          def main() raises:
              var cats: List[String] = ["a", "b", "c"]
              var vals: List[Float64] = [3.0, 1.0, 2.0]
              var c = bar(cats, vals, title="Consumer check")
              save(c, "out.svg")
              save(c, "out.png")
              print("consumer ok")
          EOF

      - name: Compile and run the consumer
        working-directory: ${{ runner.temp }}/consumer
        run: pixi run mojo run consumer.mojo

      - name: Assert both outputs exist and are non-empty
        working-directory: ${{ runner.temp }}/consumer
        run: |
          test -s out.svg || { echo "out.svg missing or empty"; exit 1; }
          test -s out.png || { echo "out.png missing or empty"; exit 1; }
          head -c 64 out.svg; echo
          ls -l out.svg out.png

      # Prints, doesn't assert: #225/#239 concluded that the
      # unconditional PythonObject import costs a consumer nothing, and
      # this is the cheap standing evidence for that claim rather than a
      # gate. If libpython ever does appear here, the log says so on the
      # PR that introduced it.
      - name: Report the consumer's dynamic dependencies
        working-directory: ${{ runner.temp }}/consumer
        run: |
          pixi run mojo build consumer.mojo -o consumer_bin
          ldd consumer_bin || true
          echo "--- python linkage ---"
          ldd consumer_bin | grep -i python || echo "no libpython in the consumer's dynamic dependencies"

  # PR-status-only docs build -- used to be a separate workflow
  # (docs.yml, deleted) that called the same reusable docs-build.yml
  # push-to-main deploys still use (docs-deploy.yml). Folded in here
  # instead, as its own job rather than a step tacked onto `test`
  # above, deliberately: every quickplot function's/Plot method's own
  # `Example:` docstring section (dataviz/*.mojo) exists to feed
  # this package's docs site (its gallery images, and the snippets
  # gen_example_docs.mojo extracts from them via extract_docstring_
  # examples.mojo), not this repo's own test signal -- `pixi run
  # example` used to run inside the `test` job on every push/PR
  # regardless of whether anything docs-relevant even changed, which
  # both muddied what `test` actually verifies (real assertions vs.
  # "did every example still render") and meant every PR paid its
  # heavy from-source Mojo recompile cost (see the wiki's flaky-suite
  # note -- every extra parallel Mojo compile is another independent
  # roll against that compiler crash) whether or not the docs site was
  # even in play. Rendering now happens exactly once per signal path:
  # here for the PR-status check, and separately inside docs-build.yml
  # for an actual push-to-main deploy -- not shared between those two,
  # but they run on different, mutually exclusive events, so there's no
  # single signal path that pays for it twice anymore. Runs
  # unconditionally on every PR (no path filter, unlike docs-deploy.yml)
  # since it's the only place examples get exercised at all now -- worth
  # catching an example/docs break (a bad docstring, a new example
  # missing from gen_example_docs.mojo's own category lists) even on a
  # PR that doesn't obviously look docs-related. No Pages artifact
  # upload here (unlike docs-build.yml) -- nothing deploys from a PR, so
  # job success/failure is the whole signal.
  docs-build:
    name: Docs build (status check)
    runs-on: ubuntu-latest
    # Mojo compiles here are heavy -- pixi run example alone has taken
    # several minutes per file in this repo before; see `test`'s own
    # identical comment.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same runtime requirement as `test`'s own identical step -- see
      # its comment for the full "why fontconfig, not freetype" story.
      # Needed here specifically because this job renders every
      # `Example:` docstring section itself (below), which draw real
      # text same as tests do.
      - name: Install libfontconfig and test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.76.2
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Render quickstart tutorial examples
        run: pixi run example-quickstart

      - name: Build docs site
        run: pixi run docs
