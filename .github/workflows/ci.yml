name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check [workspace]/[package] version agree
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_version.sh

  format-check:
    name: mojo format --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Check formatting
        run: pixi run format-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-noto-cjk

      - name: Install the test fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-dejavu

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Check the runner's module-timeout guard
        run: pixi run test-runner

      - name: Run tests
        run: pixi run test


  max-adapter:
    name: MAX Python Tensor and Buffer adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install the test font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Run MAX adapter tests under the Mojo 1.2 environment
        run: pixi run -e max-adapter test-max-adapter

  package:
    name: Build the package and compile a consumer against it
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      # The consumer's path dependency builds this package with the
      # pixi-build-mojo backend, so it is the build check. A separate
      # `pixi build` step used to run first; pixi deprecated that command
      # in 0.68 in favor of `pixi publish`, which refuses a package whose
      # run dependencies come from source (canvas_mojo's git pin), so the
      # step went rather than the warning staying. `pixi build` also
      # ignores the nightly channel's `exclude-newer` for the source
      # dependencies (#863), so it is no stand-in locally either; this
      # script is `pixi run check-consumer`. It takes the channels from
      # pixi.toml, builds, runs the consumer, and checks the backend
      # used `mojo precompile` without the #603 deprecation warnings.
      - name: Build the package and run a consumer against it
        run: python3 scripts/check_consumer.py "$RUNNER_TEMP/consumer"

      # Each mark_*() setter binds only its own renderer. #817 compiled
      # every mark family into every program and doubled compile time
      # with every test green. Linux x86 only: one platform shows it.
      - name: Check a one-mark program compiles no other mark's renderer
        if: matrix.os == 'ubuntu-latest'
        run: pixi run check-mark-isolation
      - name: A misplaced encoder is a compile error (#828)
        if: matrix.os == 'ubuntu-latest'
        run: pixi run check-typed-misuse

      - name: Report the consumer's dynamic dependencies
        working-directory: ${{ runner.temp }}/consumer
        run: |
          pixi run mojo build consumer.mojo -o consumer_bin
          ldd consumer_bin || true
          echo "--- python linkage ---"
          ldd consumer_bin | grep -i python || echo "no libpython in the consumer's dynamic dependencies"


  fontless-export:
    name: Export PNG and PDF without system fonts
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      - name: Install checkout prerequisites without fonts
        run: apt-get update && apt-get install -y git ca-certificates curl

      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Assert the image has no system font files
        run: |
          found=$(find /usr/share/fonts /usr/local/share/fonts /usr/share/X11/fonts \
            -type f \( -iname '*.ttf' -o -iname '*.ttc' -o -iname '*.otf' -o -iname '*.otc' \) \
            2>/dev/null | head -n 1 || true)
          test -z "$found" || { echo "system font found: $found"; exit 1; }

      - name: Compile a package consumer and export both formats
        run: |
          mkdir -p "$RUNNER_TEMP/fontless-consumer"
          cat > "$RUNNER_TEMP/fontless-consumer/pixi.toml" <<EOF
          [workspace]
          name = "fontless-consumer"
          version = "0.0.0"
          channels = [{ channel = "https://conda.modular.com/max-nightly", exclude-newer = "2026-09-21T12:00:00Z" }, "https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]

          [dependencies]
          dataviz_mojo = { path = "$GITHUB_WORKSPACE" }
          EOF
          cp tests/fontless_consumer.mojo "$RUNNER_TEMP/fontless-consumer/consumer.mojo"
          cd "$RUNNER_TEMP/fontless-consumer"
          pixi run sh -c 'test -s "$CONDA_PREFIX/fonts/DejaVuSans.ttf"'
          pixi run mojo run consumer.mojo
          test -s fontless.png
          test -s fontless.pdf

  docs-build:
    name: Docs build (status check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Render quickstart tutorial examples
        run: pixi run example-quickstart

      - name: Build docs site
        run: pixi run docs
