name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Check [workspace]/[package] version agree
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_version.sh

  format-check:
    name: mojo format --check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Check formatting
        run: pixi run format-check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install the test fonts (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask font-dejavu

      # TEMPORARY (#734 evaluation): records what the runner actually has,
      # so "the suite passes without installing fontconfig" can be read
      # against whether the image ships it anyway. Remove before merge.
      - name: Font environment
        run: |
          echo "--- fontconfig library present?"
          if [ "$RUNNER_OS" = "Linux" ]; then
            ldconfig -p | grep -i fontconfig || echo "none in ldconfig"
            dpkg -l | grep -i fontconfig || echo "no fontconfig package"
          else
            brew list --versions fontconfig || echo "no fontconfig formula"
            ls /opt/homebrew/lib/libfontconfig* 2>/dev/null || echo "no dylib in /opt/homebrew/lib"
          fi
          echo "--- fc-list tool?"
          command -v fc-list || echo "no fc-list"
          echo "--- DejaVu files the renderer can find"
          find /usr/share/fonts /opt/homebrew/share/fonts ~/Library/Fonts \
            /Library/Fonts -iname "DejaVu*" 2>/dev/null | head -5

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Check the runner's module-timeout guard
        run: pixi run test-runner

      - name: Run tests
        run: pixi run test

  package:
    name: Build the package and compile a consumer against it
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      # The consumer's path dependency below builds this package with the
      # same pixi-build-mojo backend, so it is the build check. A separate
      # `pixi build` step used to run first; pixi deprecated that command
      # in 0.68 in favor of `pixi publish`, which refuses a package whose
      # run dependencies come from source (canvas_mojo's git pin), so the
      # step went rather than the warning staying.
      - name: Create a throwaway consumer workspace
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cat > "$RUNNER_TEMP/consumer/pixi.toml" <<EOF
          [workspace]
          name = "dataviz-consumer-check"
          version = "0.0.0"
          channels = ["https://conda.modular.com/max", "https://repo.prefix.dev/modular-community", "conda-forge"]
          platforms = ["linux-64"]
          preview = ["pixi-build"]

          [dependencies]
          dataviz_mojo = { path = "$GITHUB_WORKSPACE" }
          EOF
          cat > "$RUNNER_TEMP/consumer/consumer.mojo" <<'EOF'
          from dataviz import bar
          from dataviz.plot import save

          def main() raises:
              var cats: List[String] = ["a", "b", "c"]
              var vals: List[Float64] = [3.0, 1.0, 2.0]
              var c = bar(cats, vals, title="Consumer check")
              save(c, "out.svg")
              save(c, "out.png")
              print("consumer ok")
          EOF

      # The build backend runs here, so this is where its output can be
      # read. Kept as one step for that reason: the backend only builds
      # on the first `pixi run`, so splitting the assertions into a step
      # of their own would find nothing to assert against.
      - name: Compile and run the consumer, and check how it was packaged
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -o pipefail
          pixi run mojo run consumer.mojo 2>&1 | tee build.log
          # pixi-build-mojo below 0.2.6 packages with `mojo package` into
          # a .mojopkg and warns twice while doing it (#603). Those
          # warnings are the only symptom, so without this the backend
          # can quietly fall back and nothing fails.
          grep -q "mojo precompile" build.log || {
            echo "the backend did not use 'mojo precompile' -- it resolved"
            echo "an older pixi-build-mojo than intended. Check that the"
            echo "pixi-version above is new enough for the backend's"
            echo "pixi-build-api-version (7 needs pixi 0.77.0 or later)."
            exit 1
          }
          if grep -qE "'package' is deprecated|'\.mojopkg' file extensions is deprecated" build.log; then
            echo "the packaging deprecation warnings of #603 are back:"
            grep -E "deprecated" build.log
            exit 1
          fi
          echo "packaged with precompile, no packaging deprecation warnings"

      - name: Assert both outputs exist and are non-empty
        working-directory: ${{ runner.temp }}/consumer
        run: |
          test -s out.svg || { echo "out.svg missing or empty"; exit 1; }
          test -s out.png || { echo "out.png missing or empty"; exit 1; }
          head -c 64 out.svg; echo
          ls -l out.svg out.png

      - name: Report the consumer's dynamic dependencies
        working-directory: ${{ runner.temp }}/consumer
        run: |
          pixi run mojo build consumer.mojo -o consumer_bin
          ldd consumer_bin || true
          echo "--- python linkage ---"
          ldd consumer_bin | grep -i python || echo "no libpython in the consumer's dynamic dependencies"

  docs-build:
    name: Docs build (status check)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install the test fonts (Linux)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.78.0
          cache: true

      - name: Render examples
        run: pixi run example

      - name: Render quickstart tutorial examples
        run: pixi run example-quickstart

      - name: Build docs site
        run: pixi run docs
