baseURL: https://randyzwitch.com/dataviz_mojo/
locale: en-US
title: dataviz_mojo
disablePathToLower: true

author:
  name: Randy Zwitch
  email: rzwitch@gmail.com

markup:
  highlight:
    # Emit classes so Hextra can style code for light and dark themes.
    noClasses: false
  goldmark:
    renderer:
      # Required by the homepage's handwritten gallery markup.
      unsafe: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Quickstart
      weight: 1
      url: "/quickstart/"
    - name: Examples
      weight: 2
      url: "/examples/"
    - name: Cookbook
      weight: 3
      url: "/cookbook/"
    - name: API Reference
      weight: 4
      # Modo names this section after the `dataviz` import package.
      url: "/dataviz/"
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/randyzwitch/dataviz_mojo"
      params:
        icon: github

params:
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  navbar:
    displayTitle: true
    displayLogo: false
