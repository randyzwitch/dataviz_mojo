baseURL: https://randyzwitch.com/dataviz_mojo/
locale: en-US
title: dataviz_mojo
disablePathToLower: true

author:
  name: Randy Zwitch
  email: rzwitch@gmail.com

markup:
  highlight:
    # Hugo's default (noClasses: true) bakes each token's color as an
    # inline `style="color:...` attribute straight onto the element,
    # picked once from a single fixed `style:` -- that always wins over
    # any stylesheet rule, in either theme, which is why code blocks
    # were solid dark regardless of the light/dark/system switcher.
    # Hextra ships its own theme-aware Chroma stylesheet pair instead
    # (assets/css/chroma/{light,dark}.css, `.highlight` vs `.dark
    # .highlight`, both already generated from the "github" style) --
    # noClasses: false switches Hugo to emit CSS classes so those
    # actually apply instead of being overridden by inline colors.
    noClasses: false
  goldmark:
    renderer:
      # The homepage's chart-thumbnail gallery is hand-written HTML
      # (a grid of <a>/<img> cards), not a shortcode -- Goldmark drops
      # raw HTML by default and only shortcode output is exempt, so
      # this is needed for that block to render at all.
      unsafe: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Quickstart
      weight: 1
      url: "/quickstart/"
    - name: Examples
      weight: 2
      url: "/examples/"
    - name: API Reference
      weight: 3
      url: "/dataviz_mojo/"
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/randyzwitch/dataviz_mojo"
      params:
        icon: github

params:
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
  navbar:
    displayTitle: true
    displayLogo: false
