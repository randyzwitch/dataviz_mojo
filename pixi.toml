[workspace]
channels = [
    "https://conda.modular.com/max",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
name = "dataviz_mojo"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.13.0"

[dependencies]
# Admits the 1.2 series as well as 1.1, and this is tested rather
# than forward-looking. 1.2 is not on the `max` channel yet, but
# `max-nightly` has carried 1.2.0 builds since 2026-09-12. Against
# 1.2.0.dev2026092105 the whole chain rebuilds from source, the
# 42-module suite passes 1657 tests with no compiler warning, and
# tests/output_digest.txt matches -- so every mark renders byte for
# byte what it renders on 1.1, which is the question a compiler bump
# raises rather than whether it compiles.
#
# One nightly on one machine is not a support claim; the released
# 1.2.0 is what settles it.
#
# The ceiling is ours alone now. canvas_mojo v0.40.0 dropped its own
# (`mojo = ">=1.1.0"`, no upper bound), so this `<1.3` is the only
# thing that turns a breaking future Mojo into an unsatisfiable solve
# rather than a build error inside a consumer project. Keeping it
# costs a raise per Mojo series; dropping it trades a refusal nobody
# has to maintain for a failure that lands on the caller instead.
mojo = ">=1.1.0,<1.3"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", rev = "0bea340883a8c910efea6e527d8f889b5220d14f" }
# Mojo 1.1 until upstream (mojoto/morrow.mojo) publishes a 1.1 build (#673).
morrow = { git = "https://github.com/randyzwitch/morrow.mojo.git", branch = "support-mojo-1.1" }
dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.1.3" }
hugo = ">=0.165.0,<0.166"
go = ">=1.26.7,<2"
# Dev/test dependencies for numpy_interop.mojo.
numpy = ">=2.0,<3"
pandas = ">=2.0,<3"
# One DejaVu Sans face at $CONDA_PREFIX/fonts for fontless exports (#767).
font-ttf-dejavu-sans-mono = "=2.37"

# The MAX Python adapter is tested in a separate environment so MAX's
# compiler pin does not constrain the normal workspace environment.
[feature.max_adapter.dependencies]
max = ">=26.6.0,<26.7"

[feature.max_adapter.tasks]
test-max-adapter = "mojo run -I . tests/max_adapter.mojo"

[environments]
max-adapter = ["max_adapter"]

[activation.env]
# mblack caches its parsed grammar under a directory keyed only by its
# own version string and the Python version, which every environment on
# a machine shares. Mojo toolchains ship different `mblib2to3/Grammar.txt`
# under the same mblack version, so whichever environment writes the
# pickle first breaks the others: `mojo format` then fails on every file
# with "'_python_symbols' object has no attribute 'old_comptime_assert_stmt'"
# (#733). A cache inside this workspace's own .pixi cannot collide.
MBLACK_CACHE_DIR = "$PIXI_PROJECT_ROOT/.pixi/mblack-cache"

[tasks]
# Extract docstring examples, combine them into verification batches, and run
# the batches in parallel. Quickstart examples use `example-quickstart`.
example = "mkdir -p docs/src/examples && rm -rf docs/src/examples/verify && rm -f docs/src/examples/*.mojo docs/src/examples/out_* && mojo run -I . -I scripts scripts/extract_docstring_examples.mojo && mojo run -I . -I scripts scripts/build_verify_batches.mojo && bash scripts/run_parallel.sh docs/src/examples/verify/*.mojo"
example-quickstart = "bash scripts/run_parallel.sh docs/src/examples/quickstart/*.mojo"
test = "bash scripts/run_parallel.sh tests/test_*.mojo"
# The parallel runner's own timeout guard. `test` runs Mojo modules and
# cannot see the runner that launches them, so a guard that quietly stops
# working leaves a green suite and a run that never ends (#543).
test-runner = "bash tests/test_run_parallel_guard.sh"
# Regenerate tests/output_digest.txt after a rendering change you meant
# to make, then read the diff before committing it (#570).
digest-update = "mojo run -I . -I tests -I scripts scripts/write_digest.mojo"
# Run likely affected test modules. Use `test` for complete verification.
test-changed = "bash scripts/test_changed.sh"
# Format source, or format and fail if tracked files change.
format = "mojo format dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart"
format-check = "mojo format dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart && git diff --exit-code -- dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart && bash scripts/check_docstring_terms.sh && bash scripts/check_pixi_pins.sh && python3 scripts/check_dependency_pins.py && bash scripts/check_doc_warnings.sh && bash scripts/check_install_tag.sh && bash scripts/check_doc_counts.sh"
# Render representative marks; `--check` also detects quadratic scaling.
bench = "mojo run -I . -I scripts scripts/bench.mojo"
# Regenerate untracked site content after `pixi run example`.
docs-install = "bash scripts/install-modo.sh"
docs-build = { cmd = "rm -rf docs/site/content docs/site/public && mkdir -p docs/src/examples && rm -f docs/src/examples/*.md docs/src/examples/*/*.md docs/src/feature-support.md docs/src/*.json && mojo run -I . -I scripts scripts/gen_example_docs.mojo && mojo doc -I . -o docs/src/dataviz.json dataviz && .tools/modo build docs -c modo.yaml && sed -i 's/^title: dataviz$/title: API Reference/' docs/site/content/dataviz/_index.md && bash scripts/check_docs_links.sh", depends-on = [
    "docs-install",
] }
# Build the deployable site.
docs = { cmd = "hugo -s docs/site && python3 scripts/check_site_links.py docs/site/public", depends-on = ["docs-build"] }
# Serve a live preview at http://localhost:1313/dataviz_mojo/.
docs-serve = { cmd = "hugo server -s docs/site", depends-on = ["docs-build"] }

# Check version fields, optionally against a supplied git ref or tag.
check-version = "bash scripts/check_version.sh"
# A one-mark program must compile no other mark family (#607); see the
# script for why the suite cannot see this.
check-family-isolation = "bash scripts/check_family_isolation.sh"
# Bump version fields, commit, and tag without pushing.
release = "bash scripts/release.sh"

# --- Package declaration -----------------------------------------------
[package]
# Distribution metadata.
name = "dataviz_mojo"
version = "0.13.0"
description = "Grammar-of-graphics-flavored chart building for Mojo, built on canvas_mojo: a fluent Plot builder, scales, themes, and a growing set of mark types across raster and SVG backends."
license = "MIT"

[package.build]
# 0.2.7 uses both `mojo precompile` and `.mojoc` with Mojo 1.0 (#603).
backend = { name = "pixi-build-mojo", version = ">=0.2.7,<1" }
source = { path = "." }

[package.build.config.pkg]
# Mojo package and import name.
name = "dataviz"
path = "dataviz"

[package.host-dependencies]
mojo = ">=1.1.0,<1.3"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", rev = "0bea340883a8c910efea6e527d8f889b5220d14f" }
# Mojo 1.1 until upstream (mojoto/morrow.mojo) publishes a 1.1 build (#673).
morrow = { git = "https://github.com/randyzwitch/morrow.mojo.git", branch = "support-mojo-1.1" }
dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.1.3" }

[package.run-dependencies]
mojo = ">=1.1.0,<1.3"
font-ttf-dejavu-sans-mono = "=2.37"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", rev = "0bea340883a8c910efea6e527d8f889b5220d14f" }
# Mojo 1.1 until upstream (mojoto/morrow.mojo) publishes a 1.1 build (#673).
morrow = { git = "https://github.com/randyzwitch/morrow.mojo.git", branch = "support-mojo-1.1" }
dataframe_mojo = { git = "https://github.com/randyzwitch/dataframe_mojo.git", tag = "v0.1.3" }
