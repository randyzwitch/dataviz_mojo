[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "dataviz_mojo"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.7.0"

[dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.13.0" }
hugo = ">=0.165.0,<0.166"
go = ">=1.26.7,<2"
# Dev/test-only, like hugo/go: not in [package.run-dependencies], so
# installing dataviz_mojo never pulls them in. Present so
# numpy_interop.mojo has something to compile and test against; a
# caller using that adapter needs numpy in their own environment.
numpy = ">=2.0,<3"
pandas = ">=2.0,<3"

[tasks]
# `test` runs every tests/test_*.mojo file in parallel via
# scripts/run_parallel.sh, capped at the machine's CPU count. Each
# `mojo run` recompiles the package from source (no shared build cache),
# so the suite's cost is that fixed per-file compile times the file
# count; the glob picks up new test files automatically.
#
# `example` uses the same script over a generated file list:
# extract_docstring_examples.mojo writes every `Example:` docstring
# section to docs/src/examples/*.mojo, and
# docs/src/cookbook_recipes/*.mojo are complete standalone programs
# already. build_verify_batches.mojo then rewrites all of those into 8
# batch drivers under docs/src/examples/verify/, and only the batches
# are run: a single `save()` call monomorphizes the whole ~50-mark
# `_render_generic` dispatch tree, a per-process cost of ~50 CPU-s, so
# 117 one-chart programs paid it 117 times (cold: 9787 CPU-s / 174s
# wall vs 688 CPU-s / 43s wall for the batches, with byte-identical
# out_* images). The standalone programs are still written out and left
# alone; verify/ is a throwaway artifact.
#
# Precompiling the package (`mojo precompile dataviz`) was measured and
# not worth it: it halves warm per-file time only via the local build
# cache, and cold CI runs gained ~4.6% CPU and ~0.4% wall.
#
# The same per-process monomorphization cost is why tests/ is grouped
# into ~12 family modules (test_marks_basic.mojo, test_marks_polar.mojo,
# ...) rather than one file per mark: 86 files cost 6956 CPU-s cold, 13
# files 1344 CPU-s. Test function names stayed unique, so a failure
# still names the mark. test_numpy_interop.mojo stays separate because
# it is the only test needing numpy. Add new tests to the family module
# they belong to.
#
# docs/src/examples/quickstart/ (step1..step5_quickplot.mojo + their
# out_*.svg) is not part of this pipeline: `example`'s `rm -f` globs
# are one directory level only. Those five back docs/src/quickstart.md's
# walkthrough, hand-written rather than extracted from a docstring, and
# are regenerated by the separate `example-quickstart` task, which CI
# calls alongside this one.
example = "mkdir -p docs/src/examples && rm -rf docs/src/examples/verify && rm -f docs/src/examples/*.mojo docs/src/examples/out_* && mojo run -I . -I scripts scripts/extract_docstring_examples.mojo && mojo run -I . -I scripts scripts/build_verify_batches.mojo && bash scripts/run_parallel.sh docs/src/examples/verify/*.mojo"
example-quickstart = "bash scripts/run_parallel.sh docs/src/examples/quickstart/*.mojo"
test = "bash scripts/run_parallel.sh tests/test_*.mojo"
# Renders a representative mark per family at increasing sizes and
# prints wall-clock render times (scripts/bench.mojo, #230) -- a manual
# "run before a release, or after touching a mark's layout code" check,
# not part of `test`'s own pass/fail. `pixi run bench --check` adds a
# coarse quadratic-scaling detector that does fail (see the script's own
# docstring for both).
bench = "mojo run -I . -I scripts scripts/bench.mojo"
# Regenerates docs/site/content. Nothing docs-build produces is
# committed (not docs/site/content, docs/site/public, or
# docs/src/examples/ pages); .github/workflows/docs.yml deploys a fresh
# build to GitHub Pages. Committed source is docs/src/_index.md,
# docs/src/quickstart.md, docs/modo.yaml, and docs/site/'s Hugo project
# files. Assumes `pixi run example` has already run, which renders
# docs/src/examples/out_* and writes each extracted Example's *.mojo;
# this task removes only *.md and *.json there.
#
# The `*.json` clear exists because modo's `input: - src/` (modo.yaml)
# scans every *.json under docs/src/, so a stale
# docs/src/dataviz_mojo.json from before the dataviz_mojo -> dataviz
# import rename would be fed in alongside the new one (gitignored, so
# `git status` never flagged it).
#
# Sidebar order comes from each section's front-matter `weight`:
# quickstart.md pins 100, gen_example_docs.mojo pins Examples to 200
# and Cookbook to 300, and modo emits 400 for the package root with no
# config flag to change it. modo also always emits `title: dataviz` for
# that root section, so the `sed` pins it to "API Reference" to match
# the top nav (hugo.yaml); the `^title: dataviz$` anchor matches only
# that one line.
docs-install = "bash scripts/install-modo.sh"
docs-build = { cmd = "rm -rf docs/site/content docs/site/public && mkdir -p docs/src/examples && rm -f docs/src/examples/*.md docs/src/*.json && mojo run -I . -I scripts scripts/gen_example_docs.mojo && mojo doc -I . -o docs/src/dataviz.json dataviz && .tools/modo build docs -c modo.yaml && sed -i 's/^title: dataviz$/title: API Reference/' docs/site/content/dataviz/_index.md", depends-on = [
    "docs-install",
] }
# One-shot build into docs/site/public -- what docs-deploy.yml
# actually deploys.
docs = { cmd = "hugo -s docs/site", depends-on = ["docs-build"] }
# Live-reloading local preview at http://localhost:1313/dataviz_mojo/.
# Edits under docs/site/content rebuild automatically, but docs-build's
# own steps don't; re-run `pixi run docs-serve` after changing
# docstrings or examples.
docs-serve = { cmd = "hugo server -s docs/site", depends-on = ["docs-build"] }

# Checks that [workspace].version and [package].version below agree
# (scripts/check_version.sh, #228); pass a git ref/tag as an extra arg
# (`pixi run check-version v0.8.0`) to also check it against them --
# useful by hand before tagging a release, though ci.yml's own
# check-version job (no tag-push trigger exists yet) calls the script
# directly rather than through this task, and without a ref.
check-version = "bash scripts/check_version.sh"
# Bumps both version fields together, commits, and tags
# (scripts/release.sh, #228): `pixi run release 0.8.0`. Doesn't push --
# see the script's own header for the review/push step.
release = "bash scripts/release.sh"

# --- Package declaration -----------------------------------------------
[package]
# The conda/pixi distribution name, referenced by a `[dependencies]`
# entry elsewhere and `pixi add`. Kept as "dataviz_mojo" (a bare
# "dataviz" already exists on PyPI) while the Mojo import name is
# "dataviz"; see [package.build.config.pkg].
name = "dataviz_mojo"
version = "0.7.0"
description = "Grammar-of-graphics-flavored chart building for Mojo, built on canvas_mojo: a fluent Plot builder, scales, themes, and a growing set of mark types across raster and SVG backends."
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }
source = { path = "." }

[package.build.config.pkg]
# The Mojo package name (dataviz.mojopkg, `from dataviz import ...`),
# independent of the [package] distribution name above, the same split
# as PyPI's beautifulsoup4 / `import bs4`.
name = "dataviz"
path = "dataviz"

[package.host-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.13.0" }

[package.run-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.13.0" }
