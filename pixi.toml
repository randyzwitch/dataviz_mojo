[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "dataviz_mojo"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.1.0"

[dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.1.0" }

[tasks]
example = "mojo run -I . examples/scatter.mojo && mojo run -I . examples/line.mojo && mojo run -I . examples/bubble.mojo && mojo run -I . examples/bar.mojo && mojo run -I . examples/categorical_color.mojo && mojo run -I . examples/area.mojo && mojo run -I . examples/pie.mojo && mojo run -I . examples/dynamic_margin.mojo && mojo run -I . examples/facets.mojo && mojo run -I . examples/scatter_svg.mojo && mojo run -I . examples/facets_svg.mojo && mojo run -I . examples/donut.mojo && mojo run -I . examples/histogram.mojo && mojo run -I . examples/diverging_bar.mojo && mojo run -I . examples/slope.mojo && mojo run -I . examples/layers.mojo && mojo run -I . examples/lollipop.mojo && mojo run -I . examples/waterfall.mojo && mojo run -I . examples/box.mojo && mojo run -I . examples/candlestick.mojo && mojo run -I . examples/bullet.mojo && mojo run -I . examples/gantt.mojo && mojo run -I . examples/line_smoothing.mojo && mojo run -I . examples/titles.mojo && mojo run -I . examples/grouped_bar.mojo && mojo run -I . examples/stacked_bar.mojo && mojo run -I . examples/area_smoothing.mojo"
test = "mojo run -I . tests/test_scale.mojo && mojo run -I . tests/test_color_scale.mojo && mojo run -I . tests/test_ordinal_scale.mojo && mojo run -I . -I tests tests/test_core.mojo && mojo run -I . -I tests tests/test_point.mojo && mojo run -I . -I tests tests/test_line.mojo && mojo run -I . -I tests tests/test_bar.mojo && mojo run -I . -I tests tests/test_area.mojo && mojo run -I . -I tests tests/test_arc.mojo && mojo run -I . -I tests tests/test_legends.mojo && mojo run -I . -I tests tests/test_margins.mojo && mojo run -I . -I tests tests/test_facets.mojo && mojo run -I . -I tests tests/test_theme.mojo && mojo run -I . -I tests tests/test_labels.mojo && mojo run -I . -I tests tests/test_histogram.mojo && mojo run -I . -I tests tests/test_layers.mojo && mojo run -I . -I tests tests/test_lollipop.mojo && mojo run -I . -I tests tests/test_waterfall.mojo && mojo run -I . -I tests tests/test_box.mojo && mojo run -I . -I tests tests/test_candlestick.mojo && mojo run -I . -I tests tests/test_bullet.mojo && mojo run -I . -I tests tests/test_gantt.mojo && mojo run -I . -I tests tests/test_grouped_bar.mojo && mojo run -I . -I tests tests/test_stacked_bar.mojo"

# --- Package declaration -----------------------------------------------
[package]
name = "dataviz_mojo"
version = "0.1.0"
description = "Grammar-of-graphics-flavored chart building for Mojo, built on canvas_mojo: a fluent Plot builder, scales, themes, and a growing set of mark types across raster and SVG backends."
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }
source = { path = "." }

[package.build.config.pkg]
name = "dataviz_mojo"
path = "dataviz_mojo"

[package.host-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.1.0" }

[package.run-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.1.0" }
