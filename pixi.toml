[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "dataviz_mojo"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.5.0"

[dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.10.1" }
hugo = ">=0.165.0,<0.166"
go = ">=1.26.7,<2"
# Dev/test-only, same as hugo/go above -- neither appears in
# [package.run-dependencies] below, so installing dataviz_mojo itself
# never pulls numpy/pandas in. They're here only so the numpy adapter
# (numpy_interop.mojo) has something real to compile and test against
# locally and in CI -- a caller who actually uses that adapter needs
# numpy installed in *their own* environment regardless (Python.
# import_module("numpy") raises a clear error if it isn't), same as
# any optional Python interop.
numpy = ">=2.0,<3"
pandas = ">=2.0,<3"

[tasks]
# `test` runs every file in parallel via scripts/run_parallel.sh
# (capped at the machine's own CPU count -- see that script's own
# docstring) instead of one `mojo run` per file chained with `&&`:
# each `mojo run` process pays Mojo's own from-source recompile cost
# independently (no shared build cache across files), so this whole
# suite was dominated by that fixed per-file cost times the file count,
# not real work -- exactly what running the independent, unrelated
# files in parallel fixes. `example` shares the same script, over a
# dynamic file list `extract_docstring_examples.mojo` writes first
# (see that script's own docstring) rather than a hand-maintained one:
# every `Example:` docstring section becomes its own real, compiled,
# run `.mojo` program under docs/src/examples/, the same load-bearing-
# test role `examples/*.mojo` used to have before #131 moved each
# one's runnable code into its own function's docstring. Also globs
# docs/src/cookbook_recipes/*.mojo directly, no extraction step needed
# there -- a contributed Cookbook recipe is already a complete,
# standalone program by its own README.md's contract, so the same
# load-bearing-test property holds with no intermediate file.
#
# `test`'s own file order is deliberately NOT alphabetical -- most-
# expensive-first, the same "longest job first" scheduling heuristic
# canvas_mojo's own pixi.toml already uses (this repo built on that
# one, see the wiki): on a CPU-constrained CI runner (fewer cores than
# files), xargs -P starts jobs in list order as slots free up, so a
# slow file sitting at the *end* of the list starts late and finishes
# alone after every fast one's already done -- put first instead, it
# runs the whole time alongside everything else, and the fast files
# backfill the freed-up slots around it. Ranked by real measured cost,
# not a guess: each test file's own `pixi run test` Summary line (its
# own total assertion time, not `mojo run`'s shared, roughly-constant
# per-file compile overhead) from a real run on this machine --
# re-measure and re-sort if the ranking ever drifts far enough to
# matter (a new test file added at the end is always at least
# functionally correct, just not optimally placed -- true right now for
# beeswarm/violin/ridgeline below, added after this ranking was
# measured, and for test_numpy_interop.mojo too: its own `TestSuite`-
# reported per-test times look wild for anything touching Python
# interop, 100+ seconds for a single call -- but real wall-clock
# `time` on the whole file says ~5s, in line with every other file
# here, so that reported number is some clock-domain confusion
# specific to Python-interop tests (likely GIL/subinterpreter
# accounting), not a real cost -- left at the end rather than acted on
# until re-measured against real wall-clock time). `example`'s own file order is left to `extract_docstring_
# examples.mojo`'s own `_pages()` order (`_example_docstrings.mojo`) --
# there's no equivalent per-file timing to rank it by any more now that
# it isn't a fixed, hand-maintained list.
#
# EXCEPTION: docs/src/examples/quickstart/ (step1..step5_quickplot.mojo
# + their out_*.svg) is NOT part of this pipeline -- this task's own
# `rm -f docs/src/examples/*.mojo docs/src/examples/out_*` is a flat
# glob, one directory level only, so it never touches that
# subdirectory. Those five back docs/src/quickstart.md's own "A first
# chart" walkthrough (progressive Plot-builder steps, then the one-
# call `scatter()` equivalent) -- real, `mojo run`-verified output like
# everything else on this site, but hand-written and NOT extracted from
# a docstring (a deliberate scope call for a docs-only tutorial
# sequence, not package API documentation -- see the PR that added
# them). Regenerated by their own `example-quickstart` task below
# instead, called separately (both locally and by both CI paths that
# build this site -- ci.yml's `docs-build` status check and
# docs-build.yml's push-to-main deploy) rather than folded into this
# task, so it stays obvious that these five don't come from a
# docstring the way everything else here does.
example = "mkdir -p docs/src/examples && rm -f docs/src/examples/*.mojo docs/src/examples/out_* && mojo run -I . -I scripts scripts/extract_docstring_examples.mojo && bash scripts/run_parallel.sh docs/src/examples/*.mojo docs/src/cookbook_recipes/*.mojo"
example-quickstart = "bash scripts/run_parallel.sh docs/src/examples/quickstart/*.mojo"
test = "bash scripts/run_parallel.sh tests/test_quickplot.mojo tests/test_facets.mojo tests/test_line.mojo tests/test_layers.mojo tests/test_legends.mojo tests/test_point.mojo tests/test_theme.mojo tests/test_labels.mojo tests/test_bar.mojo tests/test_area.mojo tests/test_core.mojo tests/test_margins.mojo tests/test_waterfall.mojo tests/test_effect_scatter.mojo tests/test_stacked_bar.mojo tests/test_grouped_bar.mojo tests/test_lollipop.mojo tests/test_heatmap.mojo tests/test_streamgraph.mojo tests/test_population_pyramid.mojo tests/test_box.mojo tests/test_gantt.mojo tests/test_histogram.mojo tests/test_single_axis.mojo tests/test_bullet.mojo tests/test_arc.mojo tests/test_colors.mojo tests/test_candlestick.mojo tests/test_bump.mojo tests/test_chord.mojo tests/test_funnel.mojo tests/test_scale.mojo tests/test_ordinal_scale.mojo tests/test_color_scale.mojo tests/test_beeswarm.mojo tests/test_violin.mojo tests/test_ridgeline.mojo tests/test_nightingale.mojo tests/test_polar_bar.mojo tests/test_polar.mojo tests/test_radar.mojo tests/test_gauge.mojo tests/test_parallel.mojo tests/test_span_chart.mojo tests/test_calendar_heatmap.mojo tests/test_corrplot.mojo tests/test_punchcard.mojo tests/test_marimekko.mojo tests/test_sunburst.mojo tests/test_tree.mojo tests/test_treemap.mojo tests/test_arc_diagram.mojo tests/test_graph.mojo tests/test_sankey.mojo tests/test_radialbar.mojo tests/test_annotate.mojo tests/test_svg_accessibility.mojo tests/test_annotate_area.mojo tests/test_secondary_axis.mojo tests/test_secondary_axis_caption.mojo tests/test_annotate_facets_layers.mojo tests/test_annotate_vline_point.mojo tests/test_log_scale.mojo tests/test_error_bars.mojo tests/test_error_bars_asymmetric.mojo tests/test_color_map.mojo tests/test_facets_shared_scale.mojo tests/test_error_bars_on_line.mojo tests/test_percent_stacked_bar.mojo tests/test_annotate_band.mojo tests/test_annotate_best_fit.mojo tests/test_data_labels.mojo tests/test_layers_bar_combo.mojo tests/test_array_like.mojo tests/test_point_labels.mojo tests/test_numpy_interop.mojo tests/test_quickplot_numeric_types.mojo tests/test_quickplot_nested_numeric_types.mojo tests/test_horizontal_bar.mojo"
# Regenerates docs/site/content (nothing docs-build itself produces is
# committed -- not that, not docs/site/public further downstream, not
# docs/src/examples/, gen_example_docs.mojo's own output). Everything
# deployed by docs/docs-serve below is deployed straight to GitHub
# Pages by .github/workflows/docs.yml's own Actions-based deploy,
# regenerated fresh each time. Only docs/src/_index.md (the hand-
# written landing page), docs/src/quickstart.md (ditto), docs/modo.yaml,
# and docs/site/'s own Hugo project files (hugo.yaml, go.mod/go.sum) are
# real, committed source -- see docs/modo.yaml's own comments for the
# Hugo-over-plain-markdown reasoning, and gen_example_docs.mojo's own
# docstring for how it turns dataviz_mojo/*.mojo's own `Example:`
# docstring sections into docs/src/examples/ pages (a Mojo script, not
# Python -- this repo's own tooling stays in the language it's
# showcasing). Assumes `pixi run example` has already been run at least
# once -- that's what actually renders docs/src/examples/out_*.svg and
# writes each extracted `Example:` program's own *.mojo there too (this
# task only ever removes *.md there, never touches
# *.svg/*.png/*.bmp/*.mojo, the same "separate, independently-invoked
# task" split this file's own example/test tasks already have). Left-
# sidebar order falls straight out of each section's own front-matter
# `weight` -- docs/src/quickstart.md pins itself to 100, gen_example_
# docs.mojo pins Examples to 200 and Cookbook to 300, and modo's own
# generated dataviz_mojo/_index.md is left at whatever `modo build`
# emits for a package's own root section (400, as of writing, with no
# config flag to override -- `modo build --help` has nothing for it,
# and there's no local modo source to safely override via
# `--templates`) -- Quickstart, then Examples, then Cookbook, then the
# API reference, no `sed` patch needed since 400
# already sorts after both. A `sed` patch IS needed for that section's
# own front-matter `title` though: modo always emits `title:
# dataviz_mojo` (the package name) for a package's own root section,
# same "no config flag to override" gap as weight above -- but the top
# nav's own menu entry for this section already reads "API Reference"
# (hugo.yaml), so the left sidebar entry/breadcrumb links/browser tab
# for the section itself read as the odd one out next to it, all
# three sourced from this one `title` field. Pinned to "API Reference"
# post-build for consistency with the nav; every individual module
# page under it (plot/_index.md, theme/_index.md, ...) keeps its own
# real title untouched -- the `^title: dataviz_mojo$` anchor only
# matches that one root _index.md's own front-matter line, not a
# module page whose title happens to equal the package name in body
# text elsewhere.
docs-install = "bash scripts/install-modo.sh"
docs-build = { cmd = "rm -rf docs/site/content docs/site/public && mkdir -p docs/src/examples && rm -f docs/src/examples/*.md && mojo run -I . -I scripts scripts/gen_example_docs.mojo && mojo doc -I . -o docs/src/dataviz_mojo.json dataviz_mojo && .tools/modo build docs -c modo.yaml && sed -i 's/^title: dataviz_mojo$/title: API Reference/' docs/site/content/dataviz_mojo/_index.md", depends-on = [
    "docs-install",
] }
# One-shot build into docs/site/public -- what docs-deploy.yml
# actually deploys.
docs = { cmd = "hugo -s docs/site", depends-on = ["docs-build"] }
# Live-reloading local preview at http://localhost:1313/dataviz_mojo/
# -- edits under docs/site/content trigger an automatic rebuild, but
# docs-build's own steps (mojo doc, gen_example_docs.mojo, modo build)
# don't re-run on their own; re-run `pixi run docs-serve` after
# changing dataviz_mojo/'s docstrings or examples/ itself.
docs-serve = { cmd = "hugo server -s docs/site", depends-on = ["docs-build"] }

# --- Package declaration -----------------------------------------------
[package]
name = "dataviz_mojo"
version = "0.5.0"
description = "Grammar-of-graphics-flavored chart building for Mojo, built on canvas_mojo: a fluent Plot builder, scales, themes, and a growing set of mark types across raster and SVG backends."
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }
source = { path = "." }

[package.build.config.pkg]
name = "dataviz_mojo"
path = "dataviz_mojo"

[package.host-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.10.1" }

[package.run-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.10.1" }
