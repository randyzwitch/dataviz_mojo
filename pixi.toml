[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "dataviz_mojo"
platforms = ["linux-64", "osx-arm64"]
preview = ["pixi-build"]
version = "0.11.0"

[dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.27.0" }
hugo = ">=0.165.0,<0.166"
go = ">=1.26.7,<2"
# Dev/test dependencies for numpy_interop.mojo.
numpy = ">=2.0,<3"
pandas = ">=2.0,<3"

[tasks]
# Extract docstring examples, combine them into verification batches, and run
# the batches in parallel. Quickstart examples use `example-quickstart`.
example = "mkdir -p docs/src/examples && rm -rf docs/src/examples/verify && rm -f docs/src/examples/*.mojo docs/src/examples/out_* && mojo run -I . -I scripts scripts/extract_docstring_examples.mojo && mojo run -I . -I scripts scripts/build_verify_batches.mojo && bash scripts/run_parallel.sh docs/src/examples/verify/*.mojo"
example-quickstart = "bash scripts/run_parallel.sh docs/src/examples/quickstart/*.mojo"
test = "bash scripts/run_parallel.sh tests/test_*.mojo"
# Run likely affected test modules. Use `test` for complete verification.
test-changed = "bash scripts/test_changed.sh"
# Format source, or format and fail if tracked files change.
format = "mojo format dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart"
format-check = "mojo format dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart && git diff --exit-code -- dataviz tests scripts docs/cookbook_recipes docs/src/examples/quickstart"
# Render representative marks; `--check` also detects quadratic scaling.
bench = "mojo run -I . -I scripts scripts/bench.mojo"
# Regenerate untracked site content after `pixi run example`.
docs-install = "bash scripts/install-modo.sh"
docs-build = { cmd = "rm -rf docs/site/content docs/site/public && mkdir -p docs/src/examples && rm -f docs/src/examples/*.md docs/src/*.json && mojo run -I . -I scripts scripts/gen_example_docs.mojo && mojo doc -I . -o docs/src/dataviz.json dataviz && .tools/modo build docs -c modo.yaml && sed -i 's/^title: dataviz$/title: API Reference/' docs/site/content/dataviz/_index.md", depends-on = [
    "docs-install",
] }
# Build the deployable site.
docs = { cmd = "hugo -s docs/site", depends-on = ["docs-build"] }
# Serve a live preview at http://localhost:1313/dataviz_mojo/.
docs-serve = { cmd = "hugo server -s docs/site", depends-on = ["docs-build"] }

# Check version fields, optionally against a supplied git ref or tag.
check-version = "bash scripts/check_version.sh"
# Bump version fields, commit, and tag without pushing.
release = "bash scripts/release.sh"

# --- Package declaration -----------------------------------------------
[package]
# Distribution metadata.
name = "dataviz_mojo"
version = "0.11.0"
description = "Grammar-of-graphics-flavored chart building for Mojo, built on canvas_mojo: a fluent Plot builder, scales, themes, and a growing set of mark types across raster and SVG backends."
license = "MIT"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }
source = { path = "." }

[package.build.config.pkg]
# Mojo package and import name.
name = "dataviz"
path = "dataviz"

[package.host-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.27.0" }

[package.run-dependencies]
mojo = ">=1.0.0,<2"
canvas_mojo = { git = "https://github.com/randyzwitch/canvas_mojo.git", tag = "v0.27.0" }
